<!-- 로그인 오버레이 -->
<div id="auth-overlay" style="display:none;position:fixed;inset:0;background:#f0f2f5;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.10);">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#4f6ef7;border-radius:14px;margin-bottom:16px;">
        <span style="color:#fff;font-weight:800;font-size:15px;letter-spacing:1px;">OKR</span>
      </div>
      <div style="font-size:20px;font-weight:700;color:#1a1d23;">결제정산프로덕트실</div>
      <div style="font-size:14px;color:#9ca3af;margin-top:6px;">OKR 대시보드 · 접근 권한 확인</div>
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">회사 이메일</label>
      <input id="auth-email" type="email" placeholder="name@woowahan.com"
        style="width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;transition:border .15s;"
        onkeydown="if(event.key==='Enter')checkAuth()"
        onfocus="this.style.borderColor='#4f6ef7'"
        onblur="this.style.borderColor='#e5e7eb'">
    </div>
    <div id="auth-error" style="display:none;color:#ef4444;font-size:13px;margin-bottom:12px;padding:10px 14px;background:#fee2e2;border-radius:8px;"></div>
    <button onclick="checkAuth()"
      style="width:100%;padding:13px;background:#4f6ef7;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;"
      onmouseover="this.style.opacity='.88'" onmouseout="this.style.opacity='1'">
      접근하기
    </button>
  </div>
</div>
