    <div style="margin-bottom:16px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">회사 이메일</label>
      <input id="auth-email" type="email" placeholder="name@woowahan.com"
        style="width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;transition:border .15s;"
        onkeydown="if(event.key==='Enter')checkAuth()"
        onfocus="this.style.borderColor='#4f6ef7'"
        onblur="this.style.borderColor='#e5e7eb'">
    </div>
    <div id="auth-error" style="display:none;color:#ef4444;font-size:13px;margin-bottom:12px;padding:10px 14px;background:#fee2e2;border-radius:8px;"></div>
    <button onclick="checkAuth()"
      style="width:100%;padding:13px;background:#4f6ef7;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;"
      onmouseover="this.style.opacity='.88'" onmouseout="this.style.opacity='1'">
      접근하기

<script>
(function () {
  function loadAppScripts() {
    var v = window.__DASH_ASSET_V || (Date.now() + "_" + Math.random().toString(36).slice(2, 10));
    function loadScript(name, onload) {
      var s = document.createElement("script");
      s.src = name + "?v=" + encodeURIComponent(v);
      s.async = false;
      s.onload = onload;
      s.onerror = function () {
        console.error("[대시보드] 스크립트 로드 실패:", name, "- 네트워크·배포 경로를 확인하세요.");
      };
      document.head.appendChild(s);
    }
    loadScript("data.js", function () {
      loadScript("auth.js", function () {
        loadScript("app.js", function () {});
      });
    });
  }

  // GitHub Actions 배포물의 build-id.txt와 비교해, 배포가 바뀌었으면 URL만 한 번 바꿔 강제 로드 (사용자가 ? 붙일 필요 없음)
  fetch("build-id.txt?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("no build-id");
      return r.text();
    })
    .then(function (raw) {
      var id = String(raw).trim();
      var prev = localStorage.getItem("okr_deploy_id");
      if (prev && id && prev !== id) {
        localStorage.setItem("okr_deploy_id", id);
        try {
          var u = new URL(window.location.href);
          u.searchParams.set("deploy", id.slice(0, 48));
          window.location.replace(u.toString());
        } catch (e) {
          window.location.reload();
        }
        return;
      }
      if (id) localStorage.setItem("okr_deploy_id", id);
      loadAppScripts();
    })
    .catch(function () {
      loadAppScripts();
    });
})();
</script>
